name: CI/CD

env:
  CI: true

on:
  push:
    branches:
      - main
      - development
    tags:
      - "!*"

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating tags and releases
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Lerna needs git history for canary versioning

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: install
        run: |
            ulimit -n 65536
            yarn install --immutable
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Publish Snapshot
        if: github.ref == 'refs/heads/development'
        run: yarn publish:snapshot -- --provenance

      # Publish to npm using Trusted Publishing (OIDC)
      # Switch to npm client temporarily because yarn v1 does not support provenance
      # and lerna requires a clean tree, so we commit the change locally.
      - name: publish
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i 's/"npmClient": "yarn"/"npmClient": "npm"/' lerna.json
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git commit -am "chore: switch to npm for provenance" || true
          lerna publish from-package --no-git-tag-version --loglevel silly --yes --no-private -- --provenance

      - name: get package version
        if: github.ref == 'refs/heads/main'
        run: node -p -e '`PACKAGE_VERSION=${require("./package.json").version}`' >> $GITHUB_ENV

      # Create GitHub Repo tag
      - name: package-version-to-git-tag
        if: github.ref == 'refs/heads/main'
        uses: pkgdeps/git-tag-action@v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      # Create GitHub Repo release (Only on main)
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          tag_name: v${{ env.PACKAGE_VERSION }}
